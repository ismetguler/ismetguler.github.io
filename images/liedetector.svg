<svg viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI,Arial,sans-serif">
<defs>
<linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a0f24"/><stop offset="1" stop-color="#0c1226"/></linearGradient>
<linearGradient id="ac3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff5b9e"/><stop offset="1" stop-color="#6f5bff"/></linearGradient>
</defs>
<rect width="1200" height="750" fill="url(#bg3)"/>
<circle cx="250" cy="160" r="200" fill="#ff5b9e" opacity="0.12"/>
<text x="80" y="140" fill="#fff" font-size="58" font-weight="800">Lie Detector AI</text>
<text x="82" y="190" fill="#c3a8c9" font-size="30">Real-time face &amp; biometric analysis</text>
<g transform="translate(80,228)">
<rect width="150" height="56" rx="14" fill="url(#ac3)"/><text x="75" y="37" fill="#fff" font-size="22" font-weight="700" text-anchor="middle">Flutter</text>
<rect x="170" width="220" height="56" rx="14" fill="none" stroke="#3a2a4a" stroke-width="2"/><text x="280" y="37" fill="#e0cde8" font-size="22" text-anchor="middle">Google ML Kit</text>
</g>
<!-- face scan -->
<g transform="translate(560,250)">
<rect width="420" height="380" rx="24" fill="#140b1f" stroke="#3a2a4a" stroke-width="2"/>
<g stroke="#2c2140" stroke-width="1">
<line x1="40" y1="80" x2="380" y2="80"/><line x1="40" y1="160" x2="380" y2="160"/><line x1="40" y1="240" x2="380" y2="240"/><line x1="40" y1="320" x2="380" y2="320"/>
<line x1="110" y1="30" x2="110" y2="350"/><line x1="210" y1="30" x2="210" y2="350"/><line x1="310" y1="30" x2="310" y2="350"/>
</g>
<ellipse cx="210" cy="200" rx="100" ry="125" fill="none" stroke="url(#ac3)" stroke-width="3"/>
<circle cx="175" cy="170" r="9" fill="#19d3da"/><circle cx="245" cy="170" r="9" fill="#19d3da"/>
<path d="M180 250 Q210 275 240 250" fill="none" stroke="#ff5b9e" stroke-width="4"/>
<g fill="#ffd47a"><circle cx="150" cy="130" r="5"/><circle cx="270" cy="130" r="5"/><circle cx="210" cy="210" r="5"/><circle cx="160" cy="260" r="5"/><circle cx="260" cy="260" r="5"/></g>
<rect x="40" y="335" width="340" height="3" fill="#ff5b9e" opacity="0.8"/>
</g>
<!-- heartbeat -->
<g transform="translate(80,360)">
<rect width="420" height="240" rx="20" fill="#140b1f" stroke="#3a2a4a" stroke-width="2"/>
<text x="30" y="50" fill="#c3a8c9" font-size="22">Heart rate</text>
<text x="30" y="110" fill="#fff" font-size="46" font-weight="800">78 <tspan font-size="24" fill="#9fb0d0">bpm</tspan></text>
<polyline points="30,180 80,180 100,140 120,200 145,150 175,180 250,180 270,150 290,200 315,160 345,180 390,180" fill="none" stroke="#ff5b9e" stroke-width="4"/>
</g>
</svg>
